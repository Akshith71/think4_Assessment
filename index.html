<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Customer Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        input[type="text"] {
            padding: 8px;
            width: 300px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            background: #fff;
            box-shadow: 0 0 8px rgba(0,0,0,0.1);
        }

        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #007BFF;
            color: white;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        #no-results {
            color: red;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>Customer Dashboard</h1>

    <input type="text" id="searchInput" placeholder="Search by name or email..." onkeyup="searchCustomers()">

    <table id="customersTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody id="customersBody">
            <!-- Customer rows will be populated here -->
        </tbody>
    </table>

    <div id="no-results" style="display: none;">No customers found.</div>

    <script>
        let customers = [];

        // Fetch customers from the API
        fetch('/api/customers')
            .then(response => response.json())
            .then(data => {
                customers = data;
                populateTable(customers);
            })
            .catch(error => {
                console.error('Error fetching customers:', error);
            });

        function populateTable(data) {
            const tableBody = document.getElementById('customersBody');
            tableBody.innerHTML = ''; // Clear previous data

            if (data.length === 0) {
                document.getElementById('no-results').style.display = 'block';
                return;
            }

            document.getElementById('no-results').style.display = 'none';

            data.forEach(customer => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${customer.id}</td>
                    <td>${customer.name}</td>
                    <td>${customer.email}</td>
                    <td>${customer.phone}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function searchCustomers() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = customers.filter(c =>
                c.name.toLowerCase().includes(search) || c.email.toLowerCase().includes(search)
            );
            populateTable(filtered);
        }
    </script>
</body>
</html>
